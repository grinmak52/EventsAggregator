services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: events_aggregator
      POSTGRES_USER: events_user
      POSTGRES_PASSWORD: events_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U events_user -d events_aggregator"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: